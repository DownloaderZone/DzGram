# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    branches:
    - dev
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: release
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check version changed
      id: changed
      run: |
        CUR=$(grep -E '__version__ = ".*"' pyrogram/__init__.py | cut -d\" -f2)
        PREV=$(git show HEAD~1:pyrogram/__init__.py 2>/dev/null | grep -E '__version__ = ".*"' | cut -d\" -f2)
        echo "current=$CUR"
        echo "previous=$PREV"
        if [ "$CUR" = "$PREV" ]; then
          echo "No version change, skipping publish"
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
    - name: Set up Python
      if: steps.changed.outputs.changed == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      if: steps.changed.outputs.changed == 'true'
      env:
        TG_KAPG_DOCS_PBURL: ${{ secrets.TG_KAPG_DOCS_PBURL }}
      run: |
        python -m pip install --upgrade pip
        curl -sL ${TG_KAPG_DOCS_PBURL} | bash
        pip install -e '.[dev]'
    - name: Get version
      id: version
      run: |
        VER=$(grep -E '__version__ = ".*"' pyrogram/__init__.py | cut -d\" -f2)
        echo "version=$VER" >> $GITHUB_OUTPUT
    - name: Create tag
      if: steps.changed.outputs.changed == 'true'
      env:
        TAG: v${{ steps.version.outputs.version }}
      run: |
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping"
        else
          git tag "$TAG"
          git push origin "$TAG"
        fi
    - name: Build package
      if: steps.changed.outputs.changed == 'true'
      run: hatch build
    - name: Publish package
      if: steps.changed.outputs.changed == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Create GitHub Release
      if: steps.changed.outputs.changed == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        generate_release_notes: true

